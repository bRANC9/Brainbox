# ---------------------------------------------------------------------------
# Brainbox - Knowledge Platform
# PRODUCTION / TrueNAS compose file.
#
# This file does NOT build anything. It pulls a prebuilt image from GitHub
# Container Registry (built by .github/workflows/build-push.yml), because
# TrueNAS can only read/run a compose file, it cannot build images.
#
# Usage on TrueNAS (Custom App / docker compose):
#   1. Put your .env next to this file (see .env.example).
#   2. docker compose up -d
#
# Pin BRAINBOX_TAG to a version or sha for reproducible deploys.
# ---------------------------------------------------------------------------
name: brainbox

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brainbox}
      POSTGRES_USER: ${POSTGRES_USER:-brainbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-brainbox} -d ${POSTGRES_DB:-brainbox}
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional vector store. Enable by setting QDRANT_URL=http://qdrant:6333
  # in .env. Left disabled by default (empty QDRANT_URL = built-in local store).
  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: ["vector"]
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  web:
    image: ghcr.io/branc9/brainbox:${BRAINBOX_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-brainbox}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-brainbox}
      BRAINBOX_DATA_ROOT: ${BRAINBOX_DATA_ROOT:-/data/knowledge}
      BRAINBOX_SECRET_KEY: ${BRAINBOX_SECRET_KEY:-}
      BRAINBOX_GIT_TOKEN: ${BRAINBOX_GIT_TOKEN:-}
      BRAINBOX_GIT_AUTHOR_NAME: ${BRAINBOX_GIT_AUTHOR_NAME:-Brainbox}
      BRAINBOX_GIT_AUTHOR_EMAIL: ${BRAINBOX_GIT_AUTHOR_EMAIL:-brainbox@localhost}
      BRAINBOX_GITHUB_TOKEN: ${BRAINBOX_GITHUB_TOKEN:-}
      BRAINBOX_EMBEDDING_PROVIDER: ${BRAINBOX_EMBEDDING_PROVIDER:-deterministic}
      BRAINBOX_EMBEDDING_MODEL: ${BRAINBOX_EMBEDDING_MODEL:-text-embedding-3-small}
      BRAINBOX_EMBEDDING_DIM: ${BRAINBOX_EMBEDDING_DIM:-256}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      BRAINBOX_CHUNK_SIZE: ${BRAINBOX_CHUNK_SIZE:-1200}
      BRAINBOX_CHUNK_OVERLAP: ${BRAINBOX_CHUNK_OVERLAP:-150}
      BRAINBOX_AUTO_INDEX: ${BRAINBOX_AUTO_INDEX:-1}
      BRAINBOX_SEARCH_BACKEND: ${BRAINBOX_SEARCH_BACKEND:-simple}
      BRAINBOX_RERANKER: ${BRAINBOX_RERANKER:-heuristic}
      BRAINBOX_RERANK_TOP_N: ${BRAINBOX_RERANK_TOP_N:-50}
      BRAINBOX_METRICS_TOKEN: ${BRAINBOX_METRICS_TOKEN:-}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-brainbox_chunks}
      BRAINBOX_SECRET_SCAN_MODE: ${BRAINBOX_SECRET_SCAN_MODE:-off}
      BRAINBOX_LLM_PROVIDER: ${BRAINBOX_LLM_PROVIDER:-noop}
      BRAINBOX_LLM_MODEL: ${BRAINBOX_LLM_MODEL:-gpt-4o-mini}
      BRAINBOX_STALE_DAYS: ${BRAINBOX_STALE_DAYS:-180}
      OIDC_ENABLED: ${OIDC_ENABLED:-0}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_AUTHORIZE_ENDPOINT: ${OIDC_AUTHORIZE_ENDPOINT:-}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-}
      OIDC_USERINFO_ENDPOINT: ${OIDC_USERINFO_ENDPOINT:-}
      OIDC_AUTO_CREATE_USERS: ${OIDC_AUTO_CREATE_USERS:-1}
      OIDC_DEFAULT_GROUPS: ${OIDC_DEFAULT_GROUPS:-}
      BRAINBOX_ADMIN_USERNAME: ${BRAINBOX_ADMIN_USERNAME:-}
      BRAINBOX_ADMIN_EMAIL: ${BRAINBOX_ADMIN_EMAIL:-}
      BRAINBOX_ADMIN_PASSWORD: ${BRAINBOX_ADMIN_PASSWORD:-}
    volumes:
      - knowledge_data:${BRAINBOX_DATA_ROOT:-/data/knowledge}
      - static_data:/app/staticfiles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BRAINBOX_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Background worker role. Reserved for Phase 3+ jobs (git sync, chunking,
  # embedding, re-index). Safe to keep running; it idles until jobs exist.
  worker:
    image: ghcr.io/branc9/brainbox:${BRAINBOX_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "worker"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DATABASE_URL: postgres://${POSTGRES_USER:-brainbox}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-brainbox}
      BRAINBOX_DATA_ROOT: ${BRAINBOX_DATA_ROOT:-/data/knowledge}
      BRAINBOX_SECRET_KEY: ${BRAINBOX_SECRET_KEY:-}
      BRAINBOX_GIT_TOKEN: ${BRAINBOX_GIT_TOKEN:-}
      BRAINBOX_GIT_AUTHOR_NAME: ${BRAINBOX_GIT_AUTHOR_NAME:-Brainbox}
      BRAINBOX_GIT_AUTHOR_EMAIL: ${BRAINBOX_GIT_AUTHOR_EMAIL:-brainbox@localhost}
      BRAINBOX_EMBEDDING_PROVIDER: ${BRAINBOX_EMBEDDING_PROVIDER:-deterministic}
      BRAINBOX_EMBEDDING_DIM: ${BRAINBOX_EMBEDDING_DIM:-256}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-}
      BRAINBOX_AUTO_INDEX: ${BRAINBOX_AUTO_INDEX:-1}
    volumes:
      - knowledge_data:${BRAINBOX_DATA_ROOT:-/data/knowledge}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Scheduler: single owner (DB lease) fires due jobs. Safe to scale to 2+
  # replicas - only the lease holder ticks.
  scheduler:
    image: ghcr.io/branc9/brainbox:${BRAINBOX_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "scheduler"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      DJANGO_DEBUG: "0"
      DATABASE_URL: postgres://${POSTGRES_USER:-brainbox}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-brainbox}
      BRAINBOX_SCHEDULER_ENABLED: ${BRAINBOX_SCHEDULER_ENABLED:-1}
      BRAINBOX_SCHEDULER_TICK_SEC: ${BRAINBOX_SCHEDULER_TICK_SEC:-30}
      BRAINBOX_JOB_LOCK_TTL_SEC: ${BRAINBOX_JOB_LOCK_TTL_SEC:-120}
    restart: unless-stopped

volumes:
  pgdata:
  knowledge_data:
  static_data:
  qdrant_data:
