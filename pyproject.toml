[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "venv", "migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ"]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["F405", "F403"]
"**/settings.py" = ["F405", "F403"]
