# ===========================================================================
# Brainbox - TrueNAS SCALE 25.10 "Custom App" (paste this YAML into the UI)
# ===========================================================================
# This file exists so the NAS configuration is version-controlled rather than
# pasted into the UI and drifting from docker-compose.yml. It did drift once:
# a bind mount on /app/staticfiles made collectstatic fail, which left the UI
# serving an old build's CSS indefinitely and silently.
#
# EDIT (one place each):
#   1. POSTGRES_PASSWORD     (db)  -> strong password
#   2. DJANGO_SECRET_KEY     (web) -> python3 -c "import secrets;print(secrets.token_urlsafe(64))"
#   3. BRAINBOX_SECRET_KEY   (web) -> python3 -c "import secrets;print(secrets.token_urlsafe(64))"
#   4. DJANGO_ALLOWED_HOSTS  (web) -> NAS hostname / IP
#   5. DJANGO_CSRF_TRUSTED_ORIGINS (web) -> browser origin incl. scheme+port
#   6. BRAINBOX_ADMIN_USERNAME / BRAINBOX_ADMIN_PASSWORD (web) -> first-boot admin
#   7. /mnt/<POOL>/... paths -> your pool dataset
#
# Do NOT bind-mount /app/staticfiles. It is regenerated by collectstatic on
# every container start, so there is nothing to persist, and a host dataset
# arrives with the host's uid (568 on TrueNAS), which the container user
# (1000) cannot write. The symptom is a stale stylesheet that no error surfaces.
# The tmpfs below is recreated on every start and is correctly owned.
#
# Watchtower (already on the host) updates these containers via the labels; do
# NOT add one here. ghcr.io/branc9/brainbox is public, so no registry login is
# needed for Brainbox.

name: brainbox

services:
  db:
    image: postgres:16-alpine
    environment: &db-env
      POSTGRES_DB: brainbox
      POSTGRES_USER: brainbox
      # EDIT: a strong password (web/worker/entrypoint inherit it)
      POSTGRES_PASSWORD: CHANGE_ME
    volumes:
      # EDIT: absolute path on your pool
      - /mnt/<POOL>/apps/brainbox/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brainbox -d brainbox"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    image: ghcr.io/branc9/brainbox:latest
    depends_on:
      db:
        condition: service_healthy
    environment: &web-env
      DJANGO_SECRET_KEY: CHANGE_ME
      DJANGO_DEBUG: "0"
      # EDIT: NAS hostname / IP(s), comma separated, no scheme and no port
      DJANGO_ALLOWED_HOSTS: CHANGEME
      # EDIT: full origin incl. scheme + port, e.g. https://brainbox.example.com
      DJANGO_CSRF_TRUSTED_ORIGINS: ""
      DATABASE_URL: postgres://brainbox:CHANGE_ME@db:5432/brainbox
      BRAINBOX_SECRET_KEY: CHANGE_ME
      BRAINBOX_DATA_ROOT: /data/knowledge
      # EDIT: bootstrap admin, created on first boot only
      BRAINBOX_ADMIN_USERNAME: admin
      BRAINBOX_ADMIN_PASSWORD: CHANGE_ME
      BRAINBOX_ADMIN_EMAIL: ""
    volumes:
      - /mnt/<POOL>/apps/brainbox/knowledge:/data/knowledge
    # Regenerated on every start; owned by the container user (uid 1000).
    tmpfs:
      - /app/staticfiles:uid=1000,gid=1000,mode=0755
    labels:
      com.centurilinklabs.watchtower.enable: "true"
      com.centurilinklabs.watchtower.monitor-only: "false"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  worker:
    image: ghcr.io/branc9/brainbox:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *web-env
      BRAINBOX_RUN_MIGRATIONS: "0"
    volumes:
      - /mnt/<POOL>/apps/brainbox/knowledge:/data/knowledge
    tmpfs:
      - /app/staticfiles:uid=1000,gid=1000,mode=0755
    labels:
      com.centurilinklabs.watchtower.enable: "true"
    restart: unless-stopped

  scheduler:
    image: ghcr.io/branc9/brainbox:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *web-env
      BRAINBOX_RUN_MIGRATIONS: "0"
      BRAINBOX_SCHEDULER_ENABLED: "1"
      BRAINBOX_SCHEDULER_TICK_SEC: "30"
      BRAINBOX_JOB_LOCK_TTL_SEC: "120"
      BRAINBOX_JOB_POLL_SEC: "3"
      BRAINBOX_JOB_HISTORY_DAYS: "30"
    volumes:
      - /mnt/<POOL>/apps/brainbox/knowledge:/data/knowledge
    tmpfs:
      - /app/staticfiles:uid=1000,gid=1000,mode=0755
    labels:
      com.centurilinklabs.watchtower.enable: "true"
    restart: unless-stopped