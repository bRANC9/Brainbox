# ---------------------------------------------------------------------------
# Brainbox - local development compose file.
# BUILDS the image from source (do not use this on TrueNAS).
#
#   docker compose -f docker-compose.dev.yml up --build
# ---------------------------------------------------------------------------
name: brainbox-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brainbox}
      POSTGRES_USER: ${POSTGRES_USER:-brainbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainbox}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-brainbox} -d ${POSTGRES_DB:-brainbox}
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    image: brainbox:dev
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-key}
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-brainbox}:${POSTGRES_PASSWORD:-brainbox}@db:5432/${POSTGRES_DB:-brainbox}
      BRAINBOX_DATA_ROOT: /data/knowledge
      BRAINBOX_SECRET_KEY: ${BRAINBOX_SECRET_KEY:-}
      BRAINBOX_ADMIN_USERNAME: ${BRAINBOX_ADMIN_USERNAME:-admin}
      BRAINBOX_ADMIN_EMAIL: ${BRAINBOX_ADMIN_EMAIL:-admin@example.com}
      BRAINBOX_ADMIN_PASSWORD: ${BRAINBOX_ADMIN_PASSWORD:-admin}
    volumes:
      - .:/app
      - knowledge_data_dev:/data/knowledge
    ports:
      - "${BRAINBOX_PORT:-8000}:8000"

volumes:
  pgdata_dev:
  knowledge_data_dev:
