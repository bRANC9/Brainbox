{% extends "base.html" %}
{% block title %}Login - Brainbox{% endblock %}
{% block content %}
<div class="auth">
  <h1>Sign in</h1>
  {% if form.errors %}<p class="error">Invalid username or password.</p>{% endif %}
  <form method="post" class="form">
    {% csrf_token %}
    <label>Username <input type="text" name="username" autofocus required></label>
    <label>Password <input type="password" name="password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="button primary">Sign in</button>
  </form>
  {% if oidc_enabled %}
    <p><a class="button" href="{% url 'accounts:oidc_login' %}">Sign in with SSO</a></p>
  {% endif %}
</div>
{% endblock %}
